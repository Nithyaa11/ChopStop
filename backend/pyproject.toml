[project]
name = "chopstop-backend"
version = "0.1.0"
description = "Chopstop operations backend (FastAPI modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: bug-prone patterns, S: security (bandit), UP: modern syntax
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# assert is fine in tests; tests use deliberately fake/weak passwords (S105/S106).
# Real secrets in tests are still caught by gitleaks.
"tests/**" = ["S101", "S105", "S106"]
# Migrations interpolate ONLY module-level constants that are validated against a strict
# identifier regex before use (e.g. ROLE in 0002). Never interpolate settings or input.
# S608 stays enforced everywhere in app/.
"migrations/versions/**" = ["S608"]
